<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swiper Carousel Example</title>
    <!-- Swiper CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper/swiper-bundle.min.css">
    <style>
        /* Container to control the width and center the Swiper */
       
        /* Basic styles for the Swiper container */
   

        .swiper-wrapper {
            display: flex;
        }

        .swiper-slide {
            width: 415px; /* Fixed width for each card */
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #eee;
            border-radius: 8px;
            padding: 10px;
        }

        .swiper-pagination {
            position: absolute;
            bottom: 10px;
            left: 0;
            width: 100%;
            text-align: center;
        }

        .swiper-button-next, .swiper-button-prev {
            color: #000;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="swiper">
        <div class="swiper-wrapper">
            <!-- Slide 1 -->
            <div class="swiper-slide">
                <div class="card">Slide 1 Content</div>
            </div>
            <!-- Slide 2 -->
            <div class="swiper-slide">
                <div class="card">Slide 2 Content</div>
            </div>
            <!-- Slide 3 -->
            <div class="swiper-slide">
                <div class="card">Slide 3 Content</div>
            </div>
            <!-- Slide 4 -->
            <div class="swiper-slide">
                <div class="card">Slide 4 Content</div>
            </div>
            <!-- Additional Slides -->
            <div class="swiper-slide">
                <div class="card">Slide 5 Content</div>
            </div>
            <div class="swiper-slide">
                <div class="card">Slide 6 Content</div>
            </div>
        </div>

        <!-- Pagination -->
        <div class="swiper-pagination"></div>

        <!-- Navigation buttons -->
        <div class="swiper-button-next"></div>
        <div class="swiper-button-prev"></div>
    </div>
</div>
    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper/swiper-bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var swiper = new Swiper('.swiper', {
                slidesPerView: 'auto', // Allow cards to have a fixed width
                slidesPerGroup: 1,
                spaceBetween: 30, // Adjust space between cards if needed
                pagination: {
                    el: '.swiper-pagination',
                    clickable: true,
                },
                navigation: {
                    nextEl: '.swiper-button-next',
                    prevEl: '.swiper-button-prev',
                },
                loop: true,
                breakpoints: {
                    768: {
                        slidesPerView: 'auto',
                        slidesPerGroup: 1,
                    },
                    480: {
                        slidesPerView: 'auto',
                        slidesPerGroup: 1,
                    }
                }
            });
        });
    </script>

</body>
</html>
