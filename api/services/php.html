<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dropdown Menu</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        /* Basic styling for dropdown */
        .nav-item.dropdown {
            position: relative;
        }

        .nav-link.dropdown-toggle {
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .rotate-icon {
            transition: transform 0.3s ease;
            margin-left: 8px; /* Space between text and icon */
        }

        .nav-item.dropdown:hover .rotate-icon {
            transform: rotate(90deg); /* Rotate icon when hovering over parent */
        }

        .dropdown-menu {
            display: none; /* Hide the dropdown menu by default */
            position: absolute;
            top: 100%; /* Align the dropdown menu below the parent */
            left: 0; /* Align the dropdown menu with the left edge of the parent */
            background-color: white;
            border: 1px solid #ddd;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            z-index: 1000;
            min-width: 200px; /* Minimum width for dropdown items */
        }

        .nav-item.dropdown:hover .dropdown-menu {
            display: block; /* Show the dropdown menu on hover */
        }

        .dropdown-menu a {
            padding: 10px 20px;
            display: block;
            color: black;
            text-decoration: none;
        }

        .dropdown-menu a:hover {
            background-color: #f0f0f0; /* Change background on hover */
        }

        /* Submenu styling */
        .dropdown-menus.sub {
            display: none; /* Hide submenu by default */
            position: absolute;
            top: 0; /* Align with the top of the parent dropdown item */
            left: 100%; /* Position the submenu to the right of the parent dropdown item */
            margin-left: 10px; /* Space between the parent menu and submenu */
            background-color: white;
            border: 1px solid #ddd;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            min-width: 160px; /* Minimum width for submenu items */
        }

        .dropdowns:hover .dropdown-menus.sub {
            display: block; /* Show the submenu on hover */
        }
    </style>
</head>
<body>
    <nav>
        <ul class="navbar-nav">
            <li class="nav-item dropdown">
                <a class="nav-link dropdown-toggle" href="./service.html" id="dropdownMenuButton" aria-expanded="false">
                    COURCES <i class="fa-solid rotate-icon fa-chevron-right"></i>
                </a>
                <ul class="dropdown-menu submenu_list service" aria-labelledby="dropdownMenuButton">
                    <li><a class="dropdown-item" href="#">Link 1</a></li>
                    <li class="dropdowns">
                        <a class="dropdown-item" href="./services/cab_booking.html">
                            DEVELOPMENT <i class="fa-solid rotate-icon fa-chevron-down"></i>
                        </a>
                        <ul class="dropdown-menus sub">
                            <li><a class="dropdown-item" href="./chatbot.html">CHATBOT</a></li>
                            <li><a class="dropdown-item" href="./kiosk.html">KIOSK</a></li>
                            <li><a class="dropdown-item" href="./e_learning.html">E-LEARNING</a></li>
                            <li><a class="dropdown-item" href="./ai_solution.html">AI-SOLUTION</a></li>
                            <li><a class="dropdown-item" href="./billing.html">BILLING</a></li>
                        </ul>
                    </li>
                    <li><a class="dropdown-item" href="./services/hotel_manage.html">TESTING</a></li>
                    <li><a class="dropdown-item" href="./services/school_manage.html">MARKETING</a></li>
                    <li><a class="dropdown-item" href="./services/tour_manage.html">COMPUTER</a></li>
                    <li><a class="dropdown-item" href="./services/ind_base_project.html">BUSINESS STUDIES</a></li>
                </ul>
            </li>
        </ul>
    </nav>

    <!-- Include Bootstrap JavaScript for dropdown functionality -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
